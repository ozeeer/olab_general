<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>OZER TO THE RESCUE</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;background:#000;display:flex;align-items:center;justify-content:center;}
body{touch-action:none;}
#root{position:relative;width:100%;max-width:520px;display:flex;flex-direction:column;font-family:'Press Start 2P',monospace;}

/* ── HUD ── */
#hud{
background:#07071e;
border-bottom:3px solid #f5c518;
padding:7px 10px;
display:flex;justify-content:space-between;align-items:center;
flex-shrink:0;
}
.hb{text-align:center;}
.hl{font-size:7px;color:#3a5a7a;margin-bottom:2px;letter-spacing:1px;}
.hv{font-size:12px;color:#fff;letter-spacing:1px;}
#hud-upgrades{font-size:7px;color:#f5c518;padding:2px 6px;background:#1a1500;border:1px solid #f5c518;display:none;}

/* ── CANVAS ── */
canvas{display:block;width:100%;image-rendering:pixelated;background:#000;}

/* ── DPAD ── */
#dpad{
background:#050514;
border-top:2px solid #1a2540;
padding:8px;
display:grid;
grid-template-columns:1fr 1fr;
gap:6px;
flex-shrink:0;
}
.db{
font-family:‘Press Start 2P’,monospace;
font-size:10px;padding:14px 6px;
border:2px solid #1e4a1e;
background:#030d03;color:#39d353;
cursor:pointer;user-select:none;-webkit-user-select:none;
touch-action:manipulation;-webkit-tap-highlight-color:transparent;
letter-spacing:1px;
}
.db:active{background:#0e2a0e;border-color:#39d353;}
#fixbtn{
font-family:‘Press Start 2P’,monospace;
font-size:9px;padding:13px;
border:3px solid #f5c518;
background:#0c0a00;color:#f5c518;
cursor:pointer;grid-column:1/-1;
touch-action:manipulation;
letter-spacing:1px;
}
#fixbtn:active{background:#1c1800;box-shadow:0 0 12px #f5c51844;}
</style>

</head>
<body>
<div id="root">
  <div id="hud">
    <div class="hb"><div class="hl">SCORE</div><div class="hv" id="hs">000000</div></div>
    <div class="hb"><div class="hl">FIXED</div><div class="hv" id="hf">0</div></div>
    <div class="hb"><div class="hl">WAVE</div><div class="hv" id="hw">—</div></div>
    <div class="hb"><div class="hl">LIVES</div><div class="hv" id="hlv">♥♥♥</div></div>
    <div class="hb"><div class="hl">TIME</div><div class="hv" id="ht">—</div></div>
  </div>
  <canvas id="c" width="520" height="360"></canvas>
  <div id="dpad">
    <button class="db" id="bl">◄ LEFT</button>
    <button class="db" id="br">RIGHT ►</button>
    <button id="fixbtn">⚡ HOLD TO FIX  [SPACE]</button>
  </div>
</div>

<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=520,H=360,FLOOR=H-56;

// ── GAME STATE ──
let score=0,fixed=0,wave=1,lives=3,timeLeft=90,running=false,phase='title';
let animId=null,timerInt=null,particles=[],titleT=0,upgradeChoice=[];
const K={L:false,R:false,S:false};

// UPGRADES
const UPG={
  wrench:{active:false,name:'WRENCH',desc1:'Fix 2× faster',color:'#f5c518'},
  reinforced:{active:false,name:'REINFORCE',desc1:'Slower breakdowns',color:'#39d353'},
};

// HIGHSCORES (session)
let hiScores=[0,0,0];

// ── OZER ──
const OZ={x:60,y:0,vx:0,vy:0,w:40,h:60,ground:false,dir:1,fr:0,ft:0,hurt:0,
  get cx(){return this.x+20;}};

// ── MACHINE DEFS ──
const MDEFS=[
  {id:'bioprint', label:'BIOPRINTER', color:'#b44aff',bg:'#0d0018',unit:'PSI',target:12,   w:68,h:54,pts:300},
  {id:'incubator',label:'INCUBATOR',  color:'#ff7a2a',bg:'#180800',unit:'°C', target:37,   w:64,h:52,pts:250},
  {id:'co2',      label:'CO₂ CTRL',  color:'#2aff8a',bg:'#001810',unit:'%',  target:5,    w:60,h:50,pts:220},
  {id:'centrifuge',label:'CENTRIFUGE',color:'#2a8aff',bg:'#000818',unit:'RPM',target:3000, w:62,h:52,pts:270},
  {id:'scope',    label:'MICROSCOPE', color:'#ffee2a',bg:'#101000',unit:'lux',target:800,  w:58,h:50,pts:200},
  {id:'reactor',  label:'BIOREACTOR', color:'#ff2a8a',bg:'#180010',unit:'pH', target:7.4, w:64,h:54,pts:280},
];
let machines=[];

// ── HELPERS ──
function px(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x|0,y|0,w|0,h|0);}
function txt(s,x,y,sz,c,align){
  ctx.font=sz+'px monospace';ctx.fillStyle=c;ctx.textAlign=align||'center';ctx.fillText(s,x|0,y|0);
}
function spawnP(x,y,c,n){
  for(let i=0;i<n;i++)
    particles.push({x,y,vx:(Math.random()-.5)*6,vy:-Math.random()*5-1,life:40,max:40,c});
}

// ── DRAW OZER ──
// Pixel-accurate: dark curly hair, thick horseshoe mustache, narrow chin goatee/soul patch, lab coat, black shirt
function drawOzer(ox,oy,dir,fr,sc,hurt){
  sc=sc||1; const run=fr%2===0;
  const p=(x,y,w,h,c)=>{
    if(hurt>0&&Math.floor(hurt/3)%2===0)c='#ffffff';
    ctx.fillStyle=c;ctx.fillRect((ox+x*sc)|0,(oy+y*sc)|0,(w*sc)|0,(h*sc)|0);
  };

  // SHADOW
  ctx.fillStyle='rgba(0,0,0,0.28)';
  ctx.beginPath();ctx.ellipse((ox+20*sc)|0,(oy+63*sc)|0,(17*sc)|0,(4*sc)|0,0,0,Math.PI*2);ctx.fill();

  // LEGS — dark navy trousers
  const ll=run?4:0, lr=run?0:4;
  p(9,42,8,16+ll,'#1a2878'); p(24,42,8,16+lr,'#1a2878');
  // shoes — dark brown, slightly wider
  p(6,58+ll,14,5,'#120900'); p(22,58+lr,15,5,'#120900');
  p(7,61+ll,6,2,'#1e1200');  p(23,61+lr,6,2,'#1e1200'); // sole highlight

  // LAB COAT body
  p(5,18,30,26,'#d8ead8');
  // coat shading sides
  p(5,18,5,24,'#bccfbc'); p(30,18,5,24,'#bccfbc');
  // BLACK shirt/collar underneath
  p(12,18,16,7,'#0d0d1c'); p(14,19,12,18,'#0d0d1c');
  // lapels
  p(5,18,8,18,'#c2d8c2'); p(27,18,8,18,'#c2d8c2');
  // coat buttons
  p(18,26,3,2,'#9ab09a'); p(18,31,3,2,'#9ab09a'); p(18,36,3,2,'#9ab09a');
  // breast pocket
  p(7,29,8,8,'#bccfbc'); p(7,29,8,2,'#9ab09a');
  // pen in pocket
  p(9,29,2,6,'#3a3aff'); p(9,29,2,1,'#ffdd00');

  // ARMS with swing
  const as=run?(fr%2===0?-4:4):0;
  if(dir>=0){
    p(0,19+as,6,18,'#d8ead8'); p(34,19-as,6,18,'#d8ead8');
    p(0,37+as,6,7,'#c8966a');  p(34,37-as,6,7,'#c8966a');
  } else {
    p(34,19+as,6,18,'#d8ead8'); p(0,19-as,6,18,'#d8ead8');
    p(34,37+as,6,7,'#c8966a');  p(0,37-as,6,7,'#c8966a');
  }

  // WRENCH if upgraded
  if(UPG.wrench.active){
    const wx=dir>=0?38:-8;
    p(wx,33,4,14,'#999'); p(wx-2,31,8,4,'#bbb'); p(wx-2,43,8,4,'#bbb');
  }

  // NECK
  p(16,11,9,9,'#c8966a');

  // ── HEAD (big 32×24 px face) ──
  // base face — warm tan
  p(6,-14,28,24,'#c8966a');
  // cheek shading
  p(6,-14,4,20,'#ba8458'); p(30,-14,4,20,'#ba8458');
  // chin area
  p(9,8,22,4,'#c0906a');

  // EARS
  p(4,-5,4,9,'#c8966a'); p(32,-5,4,9,'#c8966a');
  p(4,-3,2,5,'#ba7a58');  p(34,-3,2,5,'#ba7a58');

  // ── HAIR — dark brown, thick curly mass ──
  // top slab
  p(4,-18,32,12,'#1c0900');
  // left side curtain
  p(2,-16,6,18,'#1c0900');
  // right side curtain
  p(32,-16,6,18,'#1c0900');
  // top wave / curl detail
  p(7,-17,28,6,'#260e00');
  p(4,-15,7,5,'#2e1200'); p(13,-17,6,5,'#2e1200');
  p(21,-17,6,5,'#2e1200'); p(29,-15,7,5,'#2e1200');
  // sideburn left
  p(2,-8,5,14,'#1c0900');
  // sideburn right
  p(33,-8,5,14,'#1c0900');

  // ── EYES — large, expressive ──
  const ex=dir>=0?1:0;
  // whites
  p(10+ex,-6,7,5,'#f0f0f0'); p(23+ex,-6,7,5,'#f0f0f0');
  // irises — dark brown
  p(12+ex,-5,4,4,'#2a1400'); p(25+ex,-5,4,4,'#2a1400');
  // pupils
  p(13+ex,-4,2,2,'#000');    p(26+ex,-4,2,2,'#000');
  // glint
  p(14+ex,-5,1,1,'#fff');    p(27+ex,-5,1,1,'#fff');
  // lower eyelid
  p(10+ex,-1,7,1,'#ba8458'); p(23+ex,-1,7,1,'#ba8458');

  // ── EYEBROWS — thick, arched ──
  p(9+ex,-9,8,2,'#1c0900');  p(22+ex,-9,8,2,'#1c0900');
  // arch peak (1px taller on inner end)
  p(9+ex,-10,3,1,'#1c0900'); p(22+ex,-10,3,1,'#1c0900');

  // ── NOSE ──
  p(19,0,3,5,'#ba8050');
  p(16,4,4,2,'#ba8050'); p(22,4,4,2,'#ba8050'); // nostrils
  p(15,5,3,1,'#a06840');  p(23,5,3,1,'#a06840');

  // ── MUSTACHE — thick horseshoe / Fu Manchu style ──
  // central bar (thick, sits right under nose)
  p(10,7,20,4,'#1c0900');
  // left arm going down
  p(8,10,6,5,'#1c0900');
  p(6,13,5,4,'#1c0900');
  p(5,15,4,3,'#1c0900');
  p(5,17,3,2,'#1c0900');
  // right arm going down
  p(26,10,6,5,'#1c0900');
  p(29,13,5,4,'#1c0900');
  p(31,15,4,3,'#1c0900');
  p(32,17,3,2,'#1c0900');
  // mustache inner highlight (texture)
  p(12,8,16,1,'#2e1400');

  // ── LIPS — visible between mustache arms ──
  p(16,11,8,2,'#c07858');

  // ── GOATEE — narrow soul patch + chin beard ──
  // soul patch (right below lips, between mustache arms)
  p(17,13,6,3,'#1c0900');
  // chin beard — tapered vertical strip
  p(16,16,8,3,'#1c0900');
  p(17,19,6,3,'#1c0900');
  p(18,22,4,3,'#1c0900');
  p(19,25,2,2,'#1c0900'); // beard tip point
}

// ── DRAW MACHINE ──
function drawMachine(m){
  const brk=m.status==='broken',wrn=m.status==='warning';
  const fc=brk?'#ff3333':wrn?'#ff9900':m.color;
  px(m.x,m.y,m.w,m.h,brk?'#1a0000':wrn?'#180a00':m.bg);
  ctx.strokeStyle=fc;ctx.lineWidth=2;ctx.strokeRect(m.x,m.y,m.w,m.h);
  px(m.x,m.y,m.w,5,fc);
  // screen
  px(m.x+4,m.y+9,m.w-8,m.h-20,brk?'#2a0000':wrn?'#1a0a00':'#000a04');
  // label
  txt(m.label,m.x+m.w/2,m.y+22,6.5,fc);
  const vs=m.val>100?Math.round(m.val).toString():m.val.toFixed(1);
  txt(vs+m.unit,m.x+m.w/2,m.y+34,7,brk?'#ff6666':wrn?'#ffcc44':'#88ffaa');
  // status led
  ctx.fillStyle=fc;ctx.beginPath();ctx.arc(m.x+m.w-8,m.y+m.h-8,5,0,Math.PI*2);ctx.fill();
  // blinking !
  if(brk&&Math.floor(Date.now()/250)%2===0){
    // glow
    ctx.shadowColor='#ff0000';ctx.shadowBlur=18;
    txt('!',m.x+m.w/2,m.y-6,18,'#ff2222');
    ctx.shadowBlur=0;
  }
  // warning pulse
  if(wrn){
    const pulse=Math.abs(Math.sin(Date.now()/300));
    ctx.strokeStyle=`rgba(255,153,0,${pulse*0.9})`;ctx.lineWidth=3;
    ctx.strokeRect(m.x-4,m.y-4,m.w+8,m.h+8);
  }
  // fix bar
  if(brk&&m.fp>0){
    px(m.x,m.y+m.h+2,m.w,7,'#111');
    ctx.shadowColor='#f5c518';ctx.shadowBlur=8;
    px(m.x,m.y+m.h+2,m.w*m.fp,7,'#f5c518');
    ctx.shadowBlur=0;
    txt('FIXING...',m.x+m.w/2,m.y+m.h+17,7,'#f5c518');
  }
}

// ── TANKS ──
let tanks=[];
function initTanks(){
  tanks=[
    {x:110,y:28,w:86,h:72,health:100,maturity:0,alive:true,t:0,label:'LUNG-A'},
    {x:220,y:28,w:86,h:72,health:100,maturity:0,alive:true,t:1.2,label:'LUNG-B'},
    {x:330,y:28,w:86,h:72,health:100,maturity:0,alive:true,t:2.4,label:'LUNG-C'},
  ];
}
function drawTank(t){
  if(!t.alive){
    px(t.x,t.y,t.w,t.h,'#150005');
    ctx.strokeStyle='#3a0010';ctx.lineWidth=2;ctx.strokeRect(t.x,t.y,t.w,t.h);
    txt('DEAD',t.x+t.w/2,t.y+t.h/2+4,9,'#660022');return;
  }
  t.t+=0.025;const mat=t.maturity/100;
  const pulse=Math.sin(t.t)*2.5*(mat+0.15);
  const hc=t.health<30?'#e74c3c':t.health<60?'#e07040':'#d050a0';
  px(t.x,t.y,t.w,t.h,'rgba(0,18,14,0.85)');
  ctx.strokeStyle=t.health<30?'#cc2222':t.health<60?'#ee6600':'#2a7a6a';
  ctx.lineWidth=2;ctx.strokeRect(t.x,t.y,t.w,t.h);
  const lh=Math.round((t.h-4)*mat);
  ctx.fillStyle='rgba(0,120,60,0.2)';ctx.fillRect(t.x+2,t.y+t.h-2-lh,t.w-4,lh);
  const cx=t.x+t.w/2,cy=t.y+t.h/2+6;
  const r=7+mat*16+pulse*mat;
  if(mat>0){
    ctx.shadowColor=hc;ctx.shadowBlur=mat>0.5?10:4;
    ctx.fillStyle=hc;
    ctx.beginPath();ctx.ellipse(cx-5,cy,r*0.6,r,0,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(cx+5,cy+2,r*0.5,r*0.85,0,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;
    ctx.strokeStyle='rgba(220,80,120,0.6)';ctx.lineWidth=1.5;
    ctx.beginPath();ctx.moveTo(cx,cy-r*.5);ctx.bezierCurveTo(cx-8,cy,cx-6,cy+r*.3,cx-5,cy+r*.5);ctx.stroke();
    ctx.beginPath();ctx.moveTo(cx,cy-r*.5);ctx.bezierCurveTo(cx+8,cy,cx+6,cy+r*.3,cx+5,cy+r*.55);ctx.stroke();
  }
  px(t.x+2,t.y+t.h-9,t.w-4,6,'#0a0a0a');
  px(t.x+2,t.y+t.h-9,(t.w-4)*(t.health/100),6,t.health<30?'#e74c3c':t.health<60?'#f39c12':'#27ae60');
  txt(t.label,t.x+t.w/2,t.y+12,7,'#4aaa6a');
  txt(Math.round(t.maturity)+'%',t.x+t.w/2,t.y+23,7,'#3a8a4a');
}

// ── BG ──
function drawBG(t){
  px(0,0,W,H,'#07071e');
  // wall grid
  for(let wy=30;wy<FLOOR;wy+=36)for(let wx=0;wx<W;wx+=36){ctx.strokeStyle='#0b0b20';ctx.lineWidth=.5;ctx.strokeRect(wx,wy,36,36);}
  // ceiling
  px(0,0,W,28,'#0c0c24');px(0,25,W,3,'#18183a');
  // ceiling lights with flicker
  [80,200,320,440].forEach((lx,i)=>{
    const on=Math.sin(t*0.5+i)>-0.98;
    px(lx-18,4,36,14,on?'#ffffa0':'#222');
    if(on){ctx.fillStyle='rgba(255,255,160,0.08)';ctx.beginPath();ctx.moveTo(lx-18,18);ctx.lineTo(lx-42,FLOOR-20);ctx.lineTo(lx+42,FLOOR-20);ctx.lineTo(lx+18,18);ctx.closePath();ctx.fill();}
  });
  // ceiling pipe
  ctx.strokeStyle='#182838';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(0,11);ctx.lineTo(W,11);ctx.stroke();
  [0,65,130,195,260,325,390,455,520].forEach(p=>{px(p-5,8,10,24,'#182838');});
  // floor tiles
  for(let fx=0;fx<W;fx+=24)px(fx,FLOOR,24,10,Math.floor(fx/24)%2===0?'#0e1a0e':'#0b160b');
  px(0,FLOOR+10,W,H-FLOOR-10,'#0a140a');
  px(0,FLOOR,W,2,'#1e4a1e');
  // shelf line
  px(0,28,W,4,'#080820');
}

// ── PARTICLES ──
function drawParticles(){
  particles=particles.filter(p=>{
    p.x+=p.vx;p.y+=p.vy;p.vy+=0.2;p.life--;
    ctx.globalAlpha=p.life/p.max;px(p.x,p.y,4,4,p.c);
    return p.life>0;
  });
  ctx.globalAlpha=1;
}

// ── MACHINES INIT ──
function initMachines(){
  const xs=[18,102,184,266,346,424];
  machines=MDEFS.map((d,i)=>({...d,x:xs[i],y:FLOOR-d.h,status:'ok',val:d.target,fp:0}));
}

// ── NEAR MACHINE ──
function getNear(){return machines.find(m=>Math.abs(OZ.cx-(m.x+m.w/2))<56)||null;}

// ── FIX ──
function doFix(dt){
  const m=getNear();if(!m||m.status!=='broken')return;
  const spd=UPG.wrench.active?0.030:0.016;
  m.fp=Math.min(1,(m.fp||0)+spd*dt);
  if(m.fp>=1){
    m.status='ok';m.val=m.target;m.fp=0;
    score+=m.pts*(1+wave*0.3)|0;fixed++;
    spawnP(m.x+m.w/2,m.y,'#f5c518',22);
    spawnP(m.x+m.w/2,m.y,m.color,12);
    document.getElementById('hf').textContent=fixed;
    updHUD();
  }
}

// ── BREAKDOWN ──
let brkTO=null;
function scheduleBrk(){
  const base=UPG.reinforced.active?5500:3200;
  const delay=base+Math.random()*5500/Math.max(1,wave*0.5);
  brkTO=setTimeout(()=>{
    if(!running)return;
    const ok=machines.filter(m=>m.status==='ok');
    if(ok.length){
      const m=ok[Math.floor(Math.random()*ok.length)];
      m.status='warning';
      const esc=UPG.reinforced.active?6500:Math.max(1200,4200-wave*320);
      setTimeout(()=>{if(m.status==='warning'){m.status='broken';spawnP(m.x+m.w/2,m.y,'#ff3333',14);}},esc);
    }
    scheduleBrk();
  },delay);
}

// ── UPDATE ──
function updateOz(dt){
  const spd=3.2+wave*0.2;
  if(K.L){OZ.vx=-spd;OZ.dir=-1;}else if(K.R){OZ.vx=spd;OZ.dir=1;}else OZ.vx*=0.6;
  OZ.x=Math.max(0,Math.min(W-OZ.w,OZ.x+OZ.vx));
  if(!OZ.ground)OZ.vy+=0.55*dt/16;
  OZ.y+=OZ.vy;
  if(OZ.y+OZ.h>=FLOOR){OZ.y=FLOOR-OZ.h;OZ.vy=0;OZ.ground=true;}else OZ.ground=false;
  if(Math.abs(OZ.vx)>0.5&&OZ.ground){OZ.ft+=dt;if(OZ.ft>100){OZ.fr=(OZ.fr+1)%2;OZ.ft=0;}}
  if(OZ.hurt>0)OZ.hurt--;
  if(K.S)doFix(dt);else machines.forEach(m=>{if(m.status==='broken')m.fp=Math.max(0,m.fp-0.008);});
}
function updateMachines(dt){
  machines.forEach(m=>{
    if(m.status==='broken')m.val+=(Math.random()-.5)*0.1*dt/16*(m.val>100?80:1);
    else if(m.status==='warning')m.val+=(Math.random()-.5)*0.04*dt/16;
    else m.val+=(m.target-m.val)*0.04;
  });
}
function updateTanks(dt){
  const brk=machines.filter(m=>m.status==='broken').length;
  tanks.forEach(t=>{
    if(!t.alive)return;
    if(brk>0){t.health=Math.max(0,t.health-brk*0.038*dt*(1+wave*0.06));}
    else{t.health=Math.min(100,t.health+0.003*dt);t.maturity=Math.min(100,t.maturity+0.005*dt);score+=0.03*dt|0;}
    if(t.health<=0){
      t.alive=false;t.health=0;lives--;
      document.getElementById('hlv').textContent='♥'.repeat(Math.max(0,lives));
      spawnP(t.x+t.w/2,t.y+t.h/2,'#ff3333',28);
      if(lives<=0)endGame(false);
    }
  });
}

// ── GAME RENDER ──
let gameT=0;
function render(dt){
  gameT+=dt;
  ctx.clearRect(0,0,W,H);
  drawBG(gameT/1000);
  tanks.forEach(drawTank);
  machines.forEach(drawMachine);
  drawParticles();
  drawOzer(OZ.x|0,OZ.y|0,OZ.dir,OZ.fr,1,OZ.hurt);
  const nr=getNear();
  if(nr){
    const c=nr.status==='broken'?'#f5c518':nr.status==='warning'?'#ff9900':'#4aff8a';
    if(nr.status==='broken')txt('HOLD SPACE — FIX '+nr.label,nr.x+nr.w/2,nr.y-10,8,c);
    else if(nr.status==='warning'){ctx.shadowColor='#ff9900';ctx.shadowBlur=8;txt('⚠ '+nr.label+' FAILING',nr.x+nr.w/2,nr.y-10,8,c);ctx.shadowBlur=0;}
  }
  // upgrade badges
  let bx=4;
  if(UPG.wrench.active){px(bx,FLOOR+14,96,13,'#1a1500');ctx.strokeStyle='#f5c518';ctx.lineWidth=1;ctx.strokeRect(bx,FLOOR+14,96,13);txt('WRENCH x2',bx+48,FLOOR+24,7,'#f5c518');bx+=102;}
  if(UPG.reinforced.active){px(bx,FLOOR+14,112,13,'#0a1500');ctx.strokeStyle='#39d353';ctx.lineWidth=1;ctx.strokeRect(bx,FLOOR+14,112,13);txt('REINFORCED',bx+56,FLOOR+24,7,'#39d353');}
  // scanlines
  for(let sy=0;sy<H;sy+=3){ctx.fillStyle='rgba(0,0,0,0.06)';ctx.fillRect(0,sy,W,1.5);}
  // top strip
  ctx.fillStyle='rgba(5,5,20,0.92)';ctx.fillRect(0,0,W,11);
  machines.forEach((m,i)=>{
    const c=m.status==='broken'?'#ff4444':m.status==='warning'?'#ff9900':'#33ff77';
    txt(m.label.slice(0,6)+':'+(m.status==='ok'?'OK':m.status==='warning'?'WRN':'ERR'),8+i*86,9,6,c,'left');
  });
}

// ── UPGRADE SCREEN ──
function pickUpgrades(){
  const pool=[
    {key:'wrench',   name:'WRENCH',      line1:'Fix machines',line2:'2× FASTER',    color:'#f5c518',ic:'W'},
    {key:'reinforced',name:'REINFORCE',  line1:'Breakdowns',  line2:'50% SLOWER',   color:'#39d353',ic:'R'},
    {key:'none',     name:'PUSH ON',     line1:'No upgrade',  line2:'STAY TOUGH',   color:'#888888',ic:'?'},
  ];
  upgradeChoice=[...pool].sort(()=>Math.random()-.5).slice(0,3);
  phase='upgrade';cancelAnimationFrame(animId);
  let ut=0;
  function loop(ts){
    ut+=16;
    ctx.clearRect(0,0,W,H);
    drawBG(ut/1000);
    ctx.fillStyle='rgba(0,0,0,0.88)';ctx.fillRect(0,0,W,H);
    // header
    ctx.shadowColor='#f5c518';ctx.shadowBlur=20;
    txt('WAVE '+( wave-1)+' CLEAR!',W/2,46,14,'#f5c518');
    ctx.shadowBlur=0;
    txt('CHOOSE YOUR UPGRADE',W/2,68,9,'#39d353');
    // cards
    upgradeChoice.forEach((u,i)=>{
      const cx=42+i*148,cy=84,cw=138,ch=160;
      // hover glow
      px(cx,cy,cw,ch,'#0a0a1e');
      ctx.shadowColor=u.color;ctx.shadowBlur=12;
      ctx.strokeStyle=u.color;ctx.lineWidth=3;ctx.strokeRect(cx,cy,cw,ch);
      ctx.shadowBlur=0;
      px(cx,cy,cw,7,u.color);
      // icon
      ctx.fillStyle=u.color+'22';ctx.beginPath();ctx.arc(cx+cw/2,cy+46,28,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle=u.color;ctx.lineWidth=2;ctx.beginPath();ctx.arc(cx+cw/2,cy+46,28,0,Math.PI*2);ctx.stroke();
      ctx.shadowColor=u.color;ctx.shadowBlur=10;
      txt(u.ic,cx+cw/2,cy+53,16,u.color);
      ctx.shadowBlur=0;
      txt(u.name,cx+cw/2,cy+88,8,u.color);
      txt(u.line1,cx+cw/2,cy+108,7,'#aaa');
      txt(u.line2,cx+cw/2,cy+122,8,'#fff');
      // button
      px(cx+10,cy+ch-28,cw-20,22,'#0e0e20');
      ctx.strokeStyle=u.color;ctx.lineWidth=1.5;ctx.strokeRect(cx+10,cy+ch-28,cw-20,22);
      txt('['+(i+1)+']  PICK',cx+cw/2,cy+ch-13,8,u.color);
    });
    // ozer celebrating
    drawOzer(W-66,H-88,1,Math.floor(ut/180)%2,1.1);
    // tap hint
    if(Math.floor(ut/600)%2===0)txt('PRESS 1  2  3  OR TAP A CARD',W/2,H-12,7,'#445566');
    if(phase==='upgrade') animId=requestAnimationFrame(loop);
  }
  animId=requestAnimationFrame(loop);
  cv.onclick=e=>{
    const r=cv.getBoundingClientRect(),mx=(e.clientX-r.left)*(W/r.width);
    [42,190,338].forEach((cx,i)=>{if(mx>=cx&&mx<=cx+138)selectUpgrade(i);});
  };
}
function selectUpgrade(i){
  if(phase!=='upgrade')return;
  const u=upgradeChoice[i];
  if(u&&u.key!=='none') UPG[u.key].active=true;
  cv.onclick=null;
  phase='playing';cancelAnimationFrame(animId);
  startWave();
}

// ── GAME OVER ──
function endGame(win){
  running=false;clearInterval(timerInt);clearTimeout(brkTO);
  // update hiscores
  hiScores.push(score);hiScores.sort((a,b)=>b-a);hiScores=hiScores.slice(0,3);
  phase=win?'win':'dead';
  let ot=0;
  function ovLoop(){
    ot+=16;
    ctx.clearRect(0,0,W,H);drawBG(ot/1000);
    tanks.forEach(drawTank);machines.forEach(drawMachine);
    ctx.fillStyle='rgba(0,0,0,0.85)';ctx.fillRect(0,0,W,H);
    const c=win?'#f5c518':'#ff3333';
    ctx.shadowColor=c;ctx.shadowBlur=24;
    txt(win?'BREAKTHROUGH!':'ORGANOIDS LOST',W/2,70,13,c);
    ctx.shadowBlur=0;
    const alive=tanks.filter(t=>t.alive).length;
    const avgM=Math.round(tanks.filter(t=>t.alive).reduce((a,t)=>a+t.maturity,0)/Math.max(1,alive));
    const lines=win?['Wave '+wave+' complete!','Organoids: '+alive+'/3','Avg maturity: '+avgM+'%','Items fixed: '+fixed,'SCORE: '+score]:
      ['All organoids lost','Fix machines faster','Items fixed: '+fixed,'SCORE: '+score];
    lines.forEach((l,i)=>txt(l,W/2,100+i*22,8,win?'#39d353':'#ff8888'));
    // hiscores
    txt('— HI-SCORES —',W/2,216,8,'#f5c518');
    hiScores.forEach((s,i)=>txt((i+1)+'. '+String(s).padStart(6,'0'),W/2,234+i*18,8,i===0?'#f5c518':'#667788'));
    drawOzer(W-72,H-100,1,Math.floor(ot/200)%2,1.2,0);
    if(Math.floor(ot/550)%2===0){ctx.shadowColor='#f5c518';ctx.shadowBlur=10;txt('► TAP TO RETRY ◄',W/2,H-22,8,'#f5c518');ctx.shadowBlur=0;}
    if(phase==='win'||phase==='dead') animId=requestAnimationFrame(ovLoop);
  }
  cancelAnimationFrame(animId);animId=requestAnimationFrame(ovLoop);
  cv.onclick=()=>{cv.onclick=null;resetAll();startWave();};
}

function updHUD(){
  document.getElementById('hs').textContent=String(score).padStart(6,'0');
  document.getElementById('hw').textContent=wave;
  document.getElementById('ht').textContent=timeLeft;
}
function resetAll(){
  score=0;fixed=0;wave=1;lives=3;timeLeft=90;gameT=0;
  UPG.wrench.active=false;UPG.reinforced.active=false;
  ['hs','hf','hw','hlv','ht'].forEach(id=>document.getElementById(id).textContent=id==='hs'?'000000':id==='hlv'?'♥♥♥':'—');
}

// ── WAVE START ──
function startWave(){
  running=true;phase='playing';timeLeft=90;
  OZ.x=80;OZ.y=FLOOR-OZ.h;OZ.vx=0;OZ.vy=0;OZ.fr=0;OZ.hurt=0;
  initMachines();initTanks();particles=[];
  document.getElementById('hw').textContent=wave;
  document.getElementById('ht').textContent=90;
  document.getElementById('hlv').textContent='♥'.repeat(lives);
  clearTimeout(brkTO);clearInterval(timerInt);
  scheduleBrk();
  timerInt=setInterval(()=>{
    if(!running)return;
    timeLeft--;document.getElementById('ht').textContent=timeLeft;
    if(timeLeft===60&&wave===1){wave=2;document.getElementById('hw').textContent=2;}
    if(timeLeft<=0){running=false;clearInterval(timerInt);clearTimeout(brkTO);wave++;pickUpgrades();}
  },1000);
  cancelAnimationFrame(animId);
  let last=0;
  function loop(ts){
    const dt=Math.min(ts-last,50);last=ts;
    if(!running)return;
    updateOz(dt);updateMachines(dt);updateTanks(dt);
    updHUD();render(dt);
    animId=requestAnimationFrame(loop);
  }
  animId=requestAnimationFrame(loop);
}

// ══════════════════════════════════════════════
// ── ARCADE TITLE SCREEN ──
// ══════════════════════════════════════════════
const TITLE_LINES=[
  "OZER'S",
  "LAB",
];
const SUBTITLE="SAVE THE ORGANOIDS!";
let marqueeX=W;
const MARQUEE="  ★ FIX BIOPRINTERS  ★ SAVE ORGANOIDS  ★ SURVIVE WAVES  ★ EARN UPGRADES  ★ ";
const HOW_TO=[
  {icon:'◄►', text:'MOVE'},
  {icon:'[SPACE]', text:'HOLD TO FIX'},
  {icon:'!', text:'BROKEN = RED'},
  {icon:'♥', text:'TANKS = LIVES'},
];

function drawTitle(){
  titleT+=0.022;
  ctx.clearRect(0,0,W,H);

  // ── BG: dark lab with animated scanlines ──
  px(0,0,W,H,'#04040f');
  // animated color bars cycling (arcade CRT vibe)
  const bars=['#1a002a','#000a1a','#001a0a','#1a0a00'];
  bars.forEach((c,i)=>{
    ctx.fillStyle=c;
    ctx.fillRect(0,i*(H/4),W,H/4);
  });

  // pixel grid overlay
  for(let wy=0;wy<H;wy+=20)for(let wx=0;wx<W;wx+=20){ctx.strokeStyle='rgba(255,255,255,0.025)';ctx.lineWidth=.5;ctx.strokeRect(wx,wy,20,20);}

  // floor
  for(let fx=0;fx<W;fx+=24)px(fx,FLOOR,24,H-FLOOR,Math.floor(fx/24)%2===0?'#0e1a0e':'#0b160b');
  px(0,FLOOR,W,2,'#1e4a1e');
  // ceiling
  px(0,0,W,26,'#0b0b22');
  [80,200,320,440].forEach(lx=>{
    px(lx-18,4,36,14,'#ffffa0');
    ctx.fillStyle='rgba(255,255,160,0.09)';
    ctx.beginPath();ctx.moveTo(lx-18,18);ctx.lineTo(lx-42,FLOOR-20);ctx.lineTo(lx+42,FLOOR-20);ctx.lineTo(lx+18,18);ctx.closePath();ctx.fill();
  });

  // ── BROKEN MACHINES in bg ──
  const bpos=[18,102,184,266,346,424];
  MDEFS.forEach((d,i)=>{
    const fl=Math.sin(titleT*2.2+i*1.05)>0.45;
    const by=FLOOR-d.h;
    px(bpos[i],by,d.w,d.h,fl?'#1a0000':'#050010');
    ctx.strokeStyle=fl?d.color:'#1a0a2a';ctx.lineWidth=2;ctx.strokeRect(bpos[i],by,d.w,d.h);
    px(bpos[i],by,d.w,5,fl?d.color:'#1a0a2a');
    if(fl){
      ctx.shadowColor=d.color;ctx.shadowBlur=14;
      txt('!',bpos[i]+d.w/2,by-6,16,d.color);
      ctx.shadowBlur=0;
    }
    txt(d.label.slice(0,6),bpos[i]+d.w/2,by+22,6,fl?d.color:'#2a1a3a');
  });

  // ── BIG OZER walking in from left ──
  const ozX=Math.min(W-200, titleT*22-60);
  const ozBob=Math.round(Math.sin(titleT*3)*2);
  if(ozX>-50) drawOzer(ozX|0,(FLOOR-60+ozBob)|0,1,Math.floor(titleT*4)%2,1.6,0);

  // ── SPEECH BUBBLE (appears after ozer walks in) ──
  if(ozX>160){
    const sbx=ozX-220, sby=FLOOR-148;
    const sbw=200, sbh=56;
    ctx.fillStyle='#f8f8e8';ctx.strokeStyle='#ccc';ctx.lineWidth=2;
    ctx.beginPath();if(ctx.roundRect)ctx.roundRect(sbx,sby,sbw,sbh,6);else ctx.rect(sbx,sby,sbw,sbh);
    ctx.fill();ctx.stroke();
    ctx.fillStyle='#f8f8e8';
    ctx.beginPath();ctx.moveTo(sbx+sbw-20,sby+sbh);ctx.lineTo(sbx+sbw-4,sby+sbh+18);ctx.lineTo(sbx+sbw-36,sby+sbh);ctx.closePath();ctx.fill();
    txt('My lab is on FIRE!',sbx+sbw/2,sby+18,7,'#1a0a00');
    txt('FIX everything or',sbx+sbw/2,sby+32,7,'#aa2200');
    txt('organoids die!',sbx+sbw/2,sby+46,7,'#aa2200');
  }

  // ── GLOWING TITLE ──
  const ty=32;
  // Line 1: OZER — big, gold
  ctx.shadowColor='#f5c518';ctx.shadowBlur=40;
  txt("OZER",W/2,ty+22,36,'#f5c518');
  ctx.shadowBlur=0;
  ctx.strokeStyle='#8b6914';ctx.lineWidth=4;
  ctx.font='36px monospace';ctx.textAlign='center';
  ctx.strokeText("OZER",W/2,ty+22);
  // Line 2: TO THE RESCUE — red/white alternating arcade flash
  const rescueCol=Math.floor(titleT*3)%2===0?'#ff4444':'#ffffff';
  ctx.shadowColor='#ff2222';ctx.shadowBlur=28;
  txt("TO THE RESCUE",W/2,ty+52,16,rescueCol);
  ctx.shadowBlur=0;
  ctx.strokeStyle='#660000';ctx.lineWidth=2;
  ctx.font='16px monospace';ctx.textAlign='center';
  ctx.strokeText("TO THE RESCUE",W/2,ty+52);

  // subtitle
  ctx.shadowColor='#39d353';ctx.shadowBlur=10;
  txt(SUBTITLE,W/2,ty+70,8,'#39d353');
  ctx.shadowBlur=0;

  // ── HOW TO PLAY strip ──
  const hty=FLOOR-90;
  px(0,hty,W,52,'rgba(0,0,10,0.82)');
  ctx.strokeStyle='#1a2a3a';ctx.lineWidth=1;ctx.strokeRect(0,hty,W,52);
  txt('HOW TO PLAY',W/2,hty+13,8,'#5a8aaa');
  HOW_TO.forEach((h,i)=>{
    const hx=52+i*116;
    ctx.fillStyle='rgba(255,255,255,0.06)';ctx.fillRect(hx-42,hty+17,84,28);
    ctx.strokeStyle='#2a3a5a';ctx.lineWidth=1;ctx.strokeRect(hx-42,hty+17,84,28);
    txt(h.icon,hx,hty+30,7,'#f5c518');
    txt(h.text,hx,hty+43,6,'#99aacc');
  });

  // ── MARQUEE ──
  marqueeX-=1.4;
  if(marqueeX<-ctx.measureText(MARQUEE).width*0.6) marqueeX=W;
  px(0,FLOOR+2,W,14,'#000a00');
  ctx.shadowColor='#39d353';ctx.shadowBlur=6;
  txt(MARQUEE,marqueeX,FLOOR+13,7,'#39d353','left');
  ctx.shadowBlur=0;

  // ── HISCORE PANEL ──
  const hsx=W-130, hsy=96;
  px(hsx,hsy,124,60,'rgba(0,0,0,0.7)');
  ctx.strokeStyle='#f5c518';ctx.lineWidth=1.5;ctx.strokeRect(hsx,hsy,124,60);
  txt('HI-SCORES',hsx+62,hsy+13,7,'#f5c518');
  hiScores.forEach((s,i)=>txt((i+1)+'. '+String(s).padStart(6,'0'),hsx+62,hsy+26+i*16,7,i===0?'#f5c518':'#556677'));

  // ── BLINK START ──
  if(Math.floor(titleT*1.6)%2===0){
    ctx.shadowColor='#ffffff';ctx.shadowBlur=14;
    txt('► PRESS SPACE OR TAP TO START ◄',W/2,H-14,8,'#ffffff');
    ctx.shadowBlur=0;
  }

  // scanlines
  for(let sy=0;sy<H;sy+=3){ctx.fillStyle='rgba(0,0,0,0.1)';ctx.fillRect(0,sy,W,1.5);}

  if(phase==='title') animId=requestAnimationFrame(drawTitle);
}

// ── INPUT ──
window.addEventListener('keydown',e=>{
  if(e.code==='ArrowLeft'||e.code==='KeyA')K.L=true;
  if(e.code==='ArrowRight'||e.code==='KeyD')K.R=true;
  if(e.code==='Space'){
    e.preventDefault();K.S=true;
    if(phase==='title'){cancelAnimationFrame(animId);resetAll();startWave();}
  }
  if(e.code==='Enter'&&phase==='title'){cancelAnimationFrame(animId);resetAll();startWave();}
  if(phase==='upgrade'){
    if(e.code==='Digit1')selectUpgrade(0);
    if(e.code==='Digit2')selectUpgrade(1);
    if(e.code==='Digit3')selectUpgrade(2);
  }
});
window.addEventListener('keyup',e=>{
  if(e.code==='ArrowLeft'||e.code==='KeyA')K.L=false;
  if(e.code==='ArrowRight'||e.code==='KeyD')K.R=false;
  if(e.code==='Space')K.S=false;
});
['bl','br'].forEach((id,i)=>{
  const b=document.getElementById(id),k=i===0?'L':'R';
  ['mousedown','touchstart'].forEach(ev=>b.addEventListener(ev,e=>{K[k]=true;e.preventDefault();},{passive:false}));
  ['mouseup','mouseleave','touchend','touchcancel'].forEach(ev=>b.addEventListener(ev,e=>{K[k]=false;},{passive:false}));
});
const fb=document.getElementById('fixbtn');
['mousedown','touchstart'].forEach(ev=>fb.addEventListener(ev,e=>{K.S=true;e.preventDefault();if(phase==='title'){cancelAnimationFrame(animId);resetAll();startWave();}},{passive:false}));
['mouseup','mouseleave','touchend','touchcancel'].forEach(ev=>fb.addEventListener(ev,()=>K.S=false,{passive:false}));
cv.addEventListener('click',e=>{
  if(phase==='title'){cancelAnimationFrame(animId);resetAll();startWave();return;}
  if(phase==='upgrade'){
    const r=cv.getBoundingClientRect(),mx=(e.clientX-r.left)*(W/r.width);
    [42,190,338].forEach((cx,i)=>{if(mx>=cx&&mx<=cx+138)selectUpgrade(i);});
  }
});

// ── BOOT ──
animId=requestAnimationFrame(drawTitle);
</script>
